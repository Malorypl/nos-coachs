<title>Coach Conseillère</title>

<style>
/* Layout: une colonne douce façon carnet cocooning ; l'accueil est le carnet, chaque leçon une carte posée dessus */
:root{
  --bg:#fdf3f5; --bg2:#f6ecfb; --surface:#fffafb; --sunk:#fbe8ee; --ink:#43293a; --muted:#8a6a7d; --line:#f1d3df;
  --accent:#6b5ca5; --accent-ink:#ffffff; --bar:#d4558c; --accent-soft:#fde0ec;
  --lav:#a98be0; --lav-soft:#eee5fb; --peach:#f6a98a; --peach-soft:#ffe9df;
  --gold:#c97a2b; --gold-soft:#fff0d9;
  --good:#3f9e7a; --good-soft:#dcf4ea; --bad:#d4546a; --bad-soft:#fde2e6;
  --shadow:0 10px 30px -12px rgba(201,90,140,.35);
  --f-display:"Fredoka", "Baloo 2", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Fredoka", "Nunito", system-ui, sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#241a24; --bg2:#2a1f33; --surface:#2f2230; --sunk:#3a2a3a; --ink:#f8e9f1; --muted:#cfaec2; --line:#4a3548;
  --accent:#f58cb7; --accent-ink:#3a1428; --bar:#5a4c92; --accent-soft:#4a2a3c;
  --lav:#c3a9f2; --lav-soft:#3a2e4f; --peach:#f8b79c; --peach-soft:#4a3029;
  --gold:#f2b96b; --gold-soft:#4a3820;
  --good:#7fd6b1; --good-soft:#1f3d33; --bad:#ff8fa0; --bad-soft:#4d2530;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#241a24; --bg2:#2a1f33; --surface:#2f2230; --sunk:#3a2a3a; --ink:#f8e9f1; --muted:#cfaec2; --line:#4a3548;
  --accent:#f58cb7; --accent-ink:#3a1428; --bar:#5a4c92; --accent-soft:#4a2a3c;
  --lav:#c3a9f2; --lav-soft:#3a2e4f; --peach:#f8b79c; --peach-soft:#4a3029;
  --gold:#f2b96b; --gold-soft:#4a3820;
  --good:#7fd6b1; --good-soft:#1f3d33; --bad:#ff8fa0; --bad-soft:#4d2530;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background:radial-gradient(600px 400px at 0% 0%,var(--bg2),transparent 70%),radial-gradient(500px 380px at 100% 30%,var(--peach-soft),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:600}
h1{font-size:clamp(30px,7vw,42px);color:var(--accent)}
h1 .sp{color:var(--lav);font-size:.7em;vertical-align:.3em;margin-left:6px}
h2{font-size:23px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.btn{border:0;border-radius:999px;padding:13px 24px;font-family:var(--f-display);font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:17px;box-shadow:0 6px 0 -1px color-mix(in srgb,var(--accent) 60%,var(--ink));transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 -1px color-mix(in srgb,var(--accent) 60%,var(--ink))}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 -1px var(--line)}
.btn.small{padding:8px 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Accueil */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:13px;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:999px;border:1.5px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.stat:nth-child(1){background:var(--lav-soft)}
.stat:nth-child(2){background:var(--accent-soft)}
.stat:nth-child(3){background:var(--peach-soft)}
.stat b{font-family:var(--f-display);font-size:clamp(24px,6vw,32px);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);line-height:1.3}
.today{background:linear-gradient(135deg,var(--accent) 0%,var(--lav) 100%);color:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.today .eyebrow{color:inherit;opacity:.9}
.today h2{font-size:clamp(26px,6vw,32px);color:#fff}
.today .btn{background:#fff;color:#6b5ca5;align-self:flex-start;box-shadow:0 6px 0 -1px rgba(80,20,60,.25)}
.today .meta{opacity:.95;font-size:15px}
.today::before{content:"✈";position:absolute;right:22px;top:10px;font-size:64px;opacity:.25;transform:rotate(12deg)}
.today::after{content:"♡";position:absolute;right:86px;bottom:-14px;font-size:90px;opacity:.15;transform:rotate(-14deg)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tool{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s}
.tool:hover{transform:translateY(-2px) rotate(-.4deg);border-color:var(--accent)}
.tool strong{font-family:var(--f-display);font-size:20px;font-weight:600}
.tool small{color:var(--muted);font-size:14px}
.tool .n{align-self:flex-start;font-family:var(--f-display);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;font-weight:600}
.tool:nth-child(2) .n{color:#8a62d6;background:var(--lav-soft)}
.ledger{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--line)}
.ledger h3{font-family:var(--f-display);font-size:15px;color:var(--ink);padding:12px 18px;background:var(--sunk);font-weight:600;display:flex;justify-content:space-between}
.wk0{--wk:#6b5ca5;--h:#f5b3cd;--r1:#fcd9e6;--r2:#f9c8db}
.wk1{--wk:#9b7fd6;--h:#cbb6f3;--r1:#e6dbfb;--r2:#d9c9f7}
.wk2{--wk:#e98b63;--h:#f7bea3;--r1:#fde3d4;--r2:#fbd3bf}
.wk3{--wk:#3f9e7a;--h:#9fdcc1;--r1:#d6f2e5;--r2:#c2eacf}
.wk4{--wk:#c98a1e;--h:#f3cf86;--r1:#fcebc6;--r2:#f8e0ab}
.ledger{border-color:var(--h);background:var(--r1);color:#1f1640}
.ledger h3{background:var(--h);color:#1f1640}
.ledger h3 span:first-child{display:flex;align-items:center;gap:8px}
.ledger h3 span:first-child::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--wk)}
.ledger .op{border-left:4px solid var(--wk);border-top-color:var(--h);background:var(--r1);color:#1f1640}
.ledger .op:nth-child(odd){background:var(--r2)}
.ledger .op:hover{background:var(--h)}
.ledger .op .t b{color:#1f1640}
.ledger .op .d{background:#ffffff;color:#1f1640;border-radius:12px;padding:6px 4px;text-align:center;font-weight:600}
.ledger .op .t small{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:999px;background:#ffffff;color:#3d3466;font-weight:700;font-size:12px}
.ledger .pill.next{background:#ffffff;color:#3d3466}
.ledger .pill.done{background:#3f9e7a;color:#fff}
.ledger .pill.late{background:#c97a2b;color:#fff}
.ledger .pill.now{background:#5a4c92;color:#fff}
.op{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1.5px dotted var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.op:hover{background:var(--sunk)}
.op .d{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.op .t{min-width:0}
.op .t b{display:block;font-weight:700;font-size:15px}
.op .t small{color:var(--muted);font-size:13px}
.pill{font-family:var(--f-display);font-size:12.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.now{background:var(--accent);color:var(--accent-ink)}
.pill.late{background:var(--gold-soft);color:var(--gold)}
.pill.next{background:var(--sunk);color:var(--muted)}
.foot{font-size:14px;color:var(--muted);text-align:center}

/* Leçon */
.bar{display:flex;align-items:center;gap:12px}
.bar .track{flex:1;height:12px;background:var(--surface);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--peach),var(--accent),var(--lav));border-radius:99px;transition:width .4s}
.x{background:none;border:0;font-size:15px;color:var(--muted);padding:6px 4px}
.stage{background:var(--surface);border-radius:28px;padding:clamp(20px,4.5vw,32px);display:flex;flex-direction:column;gap:18px;min-height:340px;box-shadow:var(--shadow);border:2px solid var(--line)}
.tag{align-self:flex-start;font-family:var(--f-display);font-size:13px;padding:5px 12px;border-radius:999px;background:var(--lav-soft);color:#7b55c8;font-weight:600}
.tag.guess{background:var(--peach-soft);color:#c0623d}
.tag.scene{background:var(--accent-soft);color:#6b5ca5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--lav)}:root:not([data-theme="light"]) .tag.guess{color:var(--peach)}:root:not([data-theme="light"]) .tag.scene{color:var(--accent)}}
:root[data-theme="dark"] .tag{color:var(--lav)}:root[data-theme="dark"] .tag.guess{color:var(--peach)}:root[data-theme="dark"] .tag.scene{color:var(--accent)}
.prompt{font-family:var(--f-display);font-size:clamp(21px,4.8vw,27px);font-weight:600;line-height:1.25;text-wrap:balance}
.hint{color:var(--muted);font-size:15px}
.reveal{background:var(--sunk);border-radius:18px;padding:18px 20px;line-height:1.65;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.reveal b{color:var(--accent)}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bubble{background:var(--accent-soft);border-radius:22px 22px 22px 6px;padding:14px 18px;font-size:18px}
.bubble::before{content:"♡ En situation";display:block;font-family:var(--f-display);font-size:13px;color:var(--accent);margin-bottom:4px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:16px;line-height:1.35;transition:transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(2px)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--lav);background:var(--lav-soft)}
.opt[disabled]{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{text-align:center;font-family:var(--f-display);font-weight:600;font-size:19px}
.typed{display:flex;gap:10px;flex-wrap:wrap}
.typed input{flex:1 1 220px;min-width:0;font-family:var(--f-body);font-size:19px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.typed input:focus{outline:none;border-color:var(--lav)}
.typed input.ok{border-color:var(--good);background:var(--good-soft)}
.typed input.ko{border-color:var(--bad);background:var(--bad-soft)}
.feedback.ko .btn.ghost{color:var(--ink)}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font-family:var(--f-display);font-size:24px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:min(220px,100%)}
.numrow .u{font-family:var(--f-display);font-size:22px;color:var(--muted)}
.feedback{border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.ko{background:var(--bad-soft);color:var(--bad)}
.feedback strong{font-family:var(--f-display);font-size:19px;font-weight:600}
.feedback.ok strong::before{content:"✦ "}
.feedback p{color:var(--ink)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .opt{padding:10px 12px;font-size:15px}
.seq{display:flex;flex-direction:column;gap:8px;min-height:20px}
.seq .opt{display:flex;gap:10px;align-items:baseline}
.seq .opt i{font-style:normal;font-family:var(--f-display);color:var(--lav);font-weight:600}
.flash{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card3d{perspective:900px}
.flip{position:relative;min-height:190px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.face.front{background:linear-gradient(135deg,var(--lav-soft),var(--accent-soft))}
.face.back{background:linear-gradient(135deg,var(--peach-soft),var(--gold-soft));transform:rotateY(180deg)}
.face p{font-size:19px;line-height:1.45}
.face.front p{font-family:var(--f-display);font-weight:600;font-size:23px}
.face .pron{font-size:15px;color:var(--muted);font-style:italic}
.cloze{font-size:19px;line-height:2.2}
.cloze input{font-family:var(--f-body);font-size:17px;padding:2px 10px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:10px;margin:0 2px}
.cloze input.ok{border:2px solid var(--good);background:var(--good-soft)}
.cloze input.ko{border:2px solid var(--bad);background:var(--bad-soft)}
.cloze .fix{font-family:var(--f-display);font-size:14px;color:var(--bad);margin-left:3px;font-weight:600}
.quote{font-size:19px;line-height:1.65;background:var(--sunk);border-radius:18px;padding:16px 20px;margin:0;position:relative}
.quote mark{background:var(--peach-soft);color:var(--ink);padding:0 4px;border-radius:6px;font-weight:700}
.end{align-items:center;text-align:center}
.stamp{font-family:var(--f-display);font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--lav));border-radius:999px;padding:12px 24px;transform:rotate(-4deg);font-size:20px;box-shadow:var(--shadow);animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}

.recall4 input{font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.recall4 input.ok{border-color:var(--good);background:var(--good-soft)}.recall4 input.ko{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:420px){.recall4 .r4{grid-template-columns:1fr}}

.mast h3{font-size:15px;margin:16px 0 8px}
.mbar{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--sunk);gap:2px}
.mbar i,.mleg i{display:block}
.ms1{background:#c9c3d6}.ms2{background:var(--peach)}.ms3{background:var(--accent)}.ms4{background:var(--good)}.ms0{background:var(--sunk)}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13px;color:var(--muted)}
.mleg span{display:inline-flex;align-items:center;gap:6px}.mleg i{width:10px;height:10px;border-radius:3px}.mleg b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mk{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mk b{font-size:22px;font-family:var(--f-display)}.mk b small{font-size:13px;color:var(--muted)}.mk span{font-size:12px;color:var(--muted);line-height:1.3}
.next5{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.next5 li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:14px}
.next5 .btn{margin:0;flex:none}
.wk8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:90px;align-items:end}
.wk8 .w{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk8 i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:0}
.wk8 span{font-size:10px;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.mgrid{grid-template-columns:1fr 1fr 1fr}.mk b{font-size:18px}}

<script>
const Q=(q,o,a,e,s)=>({k:"qcm",q,o,a,e,s});
const N=(q,a,u,e,tol)=>({k:"num",q,a,u,e,tol});
const V=(q,a,e)=>({k:"vf",q,a,e});
const O=(q,items,e)=>({k:"order",q,items,e});
const M=(q,pairs)=>({k:"match",q,pairs});

const DAYS=[
{id:"d1",date:"2026-11-06",part:"Lexique",title:"Les sigles",
caps:[
{q:"Qui est le « gendarme de la bourse », et pourquoi te concerne-t-il ?",a:"<b>L’AMF</b> (Autorité des Marchés Financiers). Sa <b>certification</b> est obligatoire pour conseiller des placements financiers. La banque te la fait passer dans les premiers mois."},
{q:"Ta banque fait faillite. Qui te rembourse, et combien ?",a:"Le <b>FGDR</b> : jusqu’à <b>100 000 €</b> par client et par banque, plus 100 000 € à part pour Livret A, LDDS et LEP."},
{q:"La Banque de France tient deux fichiers d’incidents. Lequel pour les chèques, lequel pour les crédits ?",a:"<b>FCC</b> = Fichier Central des <b>C</b>hèques (interdits de chéquier).<br><b>FICP</b> = incidents de remboursement des <b>C</b>rédits aux <b>P</b>articuliers.<br>Astuce : FC<b>C</b> comme <b>C</b>hèque, FIC<b>P</b> comme <b>P</b>rêt."},
{q:"Deux offres de crédit à comparer : quel taux regardes-tu ?",a:"Le <b>TAEG</b> (Taux Annuel Effectif Global) : le vrai coût total, frais compris.<br>Et le <b>HCSF</b> limite les crédits immobiliers à <b>35 %</b> d’endettement et <b>25 ans</b>."},
{q:"Flat tax, PS, TMI : ça se ressemble. Quelle différence ?",a:"<b>PFU / flat tax</b> : taxe sur les gains d’épargne, <b>31,4 %</b> en 2026 (30 % en assurance-vie, PEL, CEL).<br><b>PS</b> : prélèvements sociaux, <b>18,6 %</b> (17,2 % en AV, PEL, CEL).<br><b>TMI</b> : taux de la dernière tranche d’impôt atteinte (0, 11, 30, 41 ou 45 %)."},
{q:"KYC, LCB-FT, MiFID II : que demandent-elles au conseiller ?",a:"<b>KYC</b> : vérifier identité, domicile et revenus.<br><b>LCB-FT</b> : repérer et signaler les opérations suspectes.<br><b>MiFID II</b> : évaluer le profil du client avant de lui proposer de la bourse."}],
quiz:[
M("Relie chaque sigle à sa définition",[["AMF","Gendarme de la bourse"],["FGDR","Rembourse jusqu’à 100 000 €"],["FCC","Interdits de chéquier"],["FICP","Impayés de crédit"],["TAEG","Vrai coût d’un crédit"],["KYC","Connaître son client"]]),
Q("Le HCSF limite les crédits immobiliers à…",["33 % d’endettement et 20 ans","35 % d’endettement et 25 ans","40 % d’endettement et 30 ans"],1,"35 % et 25 ans (27 ans dans le neuf)."),
V("Le FICP recense les personnes interdites de chéquier.",false,"Non : c’est le FCC. Le FICP concerne les crédits."),
N("Flat tax 2026 sur les gains d’un compte-titres : combien de % ?",31.4,"%","12,8 % d’impôt + 18,6 % de prélèvements sociaux."),
Q("Quel livret est réservé aux revenus modestes ?",["LDDS","LEP","CEL"],1,"Le LEP, le mieux rémunéré (2,50 %)."),
Q("Quelle enveloppe permet d’investir en actions européennes sans impôt sur le revenu après 5 ans ?",["PEA","PER","CTO"],0,"Le PEA. Le PER fait baisser l’impôt aujourd’hui, le CTO n’a aucun avantage fiscal."),
Q("Les UC dans une assurance-vie, ce sont…",["La partie au capital garanti","Des supports à risque, sans garantie du capital","Une unité de calcul des frais"],1,"Unités de Compte : actions, immobilier… Le capital n’est pas garanti.")],
cards:[
["AMF ?","Autorité des Marchés Financiers, le « gendarme de la bourse ». Certification obligatoire pour conseiller des placements."],
["FGDR : combien ?","100 000 € par client et par banque + 100 000 € à part pour Livret A, LDDS, LEP."],
["Chèque sans provision : FCC ou FICP ?","FCC (Fichier Central des Chèques). Le FICP, c’est pour les crédits."],
["HCSF : les 2 limites ?","35 % d’endettement, 25 ans maximum."],
["TAEG ?","Taux Annuel Effectif Global : vrai coût total du crédit, tous frais compris. C’est lui qu’on compare."],
["Flat tax 2026 ?","31,4 % (12,8 % IR + 18,6 % PS). 30 % en assurance-vie, PEL et CEL."],
["TMI : les 5 taux ?","0, 11, 30, 41 et 45 %."],

{id:"d7",date:"2026-11-16",part:"Partie 4",title:"L’assurance-vie",
caps:[
{q:"Malgré son nom, qu’est-ce que l’assurance-vie, surtout ?",a:"Un <b>placement</b> : une enveloppe où le client verse de l’argent et choisit les supports. L’argent reste disponible (on parle de <b>rachat</b>), il est peu taxé après 8 ans et se transmet facilement.<br>On paie l’impôt seulement sur les gains, et seulement au moment d’un retrait."},
{q:"Fonds en euros ou UC : quelle différence ?",a:"<b>Fonds en euros</b> : capital <b>garanti</b>, rendement modéré → client prudent.<br><b>UC</b> (actions, immobilier, ETF) : capital <b>non garanti</b>, rendement potentiel plus élevé → long terme."},
{q:"Qu’est-ce qui change après 8 ans ?",a:"Avant 8 ans : gains taxés à <b>30 %</b>.<br>Après 8 ans : <b>4 600 €</b> de gains par an sans impôt sur le revenu (<b>9 200 €</b> en couple), puis <b>7,5 %</b> jusqu’à 150 000 € de versements (12,8 % au-delà). Les PS (17,2 %) restent dus.<br>Ce qui compte : la date d’<b>ouverture</b>. D’où : « ouvrez tôt, même avec 100 €, pour prendre date »."},
{q:"Et la barre des 70 ans ?",a:"Versements <b>avant 70 ans</b> : <b>152 500 € par bénéficiaire</b> sans droits de succession.<br>Versements <b>après 70 ans</b> : <b>30 500 € au total</b>, à partager entre tous les bénéficiaires."},
{q:"Qui reçoit l’argent au décès ?",a:"Les personnes désignées dans la <b>clause bénéficiaire</b>."}],
quiz:[
N("Après 8 ans, combien de gains par an sans impôt sur le revenu pour une personne seule ?",4600,"€","9 200 € pour un couple."),

{id:"d10",date:"2026-11-19",part:"Partie 7",title:"Le principe du rebond",

{q:"Le rebond : comment le définirais-tu ?",a:"Partir de ce que le client <b>demande</b> pour découvrir un besoin qu’il n’a <b>pas exprimé</b>, et lui proposer une solution adaptée. C’est <b>LE</b> point que le recruteur testera."},

{q:"« On a eu un bébé ! » Que peux-tu proposer ?",a:"Livret A pour l’enfant, assurance-vie, prévoyance, GAV."},
{q:"« Je paie trop d’impôts. » Et là ?",a:"Le <b>PER</b>, si la TMI est de <b>30 % ou plus</b>."}],

{q:"Qui échappe à la hausse ?",a:"Livrets réglementés : <b>0 %</b>. Assurance-vie, PEL, CEL : <b>30 %</b>. PEA après 5 ans : <b>18,6 %</b> (PS seuls). Compte-titres, livrets bancaires, gains du PER : <b>31,4 %</b>."},
{q:"Une personne gagne 30 000 € imposables. Sa TMI ? Combien paie-t-elle vraiment ?",a:"TMI <b>30 %</b> (tranche de 29 580 à 84 577 €), mais elle ne paie qu’environ <b>7 %</b> de son revenu (≈ 2 100 €).<br>Tranches : 0 % jusqu’à 11 600 €, puis 11 %, 30 %, 41 %, 45 %."},
{q:"PEA, compte-titres, PER : un mot sur chacun ?",a:"<b>PEA</b> : actions européennes, 150 000 € de versements, sans IR après 5 ans (un retrait avant 5 ans ferme le plan).<br><b>CTO</b> : partout, sans plafond, sans avantage (31,4 %).<br><b>PER</b> : bloqué jusqu’à la retraite, versements déduits du revenu imposable (≈ 10 % des revenus pro)."},
{q:"Le PER est-il bon pour tout le monde ?",a:"<b>Non</b> : seulement si la TMI est d’au moins <b>30 %</b>. Sinon, l’assurance-vie est meilleure.<br>Déblocage anticipé : résidence principale, décès du conjoint, invalidité, surendettement, fin des droits au chômage.<br>Avant la bourse : questionnaire <b>MiFID II</b> → profil Prudent, Équilibré ou Dynamique."}],

{q:"Quelles sont les règles du HCSF pour un crédit immobilier ?",a:"<b>35 %</b> d’endettement maximum (assurance comprise), <b>25 ans</b> maximum (27 ans dans le neuf). Chaque banque peut déroger pour <b>20 %</b> de ses dossiers."},
{q:"Calcule : un couple gagne 4 000 €/mois, rembourse 200 € de crédit auto et veut une mensualité de 1 100 €.",a:"(200 + 1 100) ÷ 4 000 × 100 = <b>32,5 %</b> → sous 35 %, c’est possible.<br>Mensualité maximum : 4 000 × 35 % = 1 400 € − 200 € = <b>1 200 €</b>."},
{q:"Apport et frais de notaire : combien ?",a:"Apport : en général <b>au moins 10 %</b> du prix (il couvre les frais de notaire).<br>Frais de notaire : <b>7 à 8 %</b> dans l’ancien, <b>2 à 3 %</b> dans le neuf."},
{q:"Où en sont les taux immobiliers ?",a:"<b>3,40 %</b> en moyenne en septembre 2026 ; environ <b>3,50-3,60 %</b> sur 20 ans en octobre ; meilleurs profils 3,00-3,25 %. En hausse depuis la rentrée, après la hausse des taux de la BCE."},
{q:"Crédit à la consommation : 3 types et un délai ?",a:"<b>Prêt personnel</b> (somme libre), <b>prêt affecté</b> (lié à un achat), <b>crédit renouvelable</b> (taux élevé, avec prudence). Rétractation : <b>14 jours</b>.<br>Et la loi <b>Lemoine</b> : on peut changer d’assurance emprunteur à tout moment."}],

{q:"Carte perdue : quel réflexe ?",a:"<b>Opposition immédiate</b> (appli, agence ou numéro 24h/24), puis nouvelle carte. Les paiements frauduleux sont en principe remboursés, sauf <b>négligence grave</b> (code donné).<br>« On bloque d’abord, on explique ensuite. »"},
{q:"Combien de temps un chèque est-il valable ?",a:"<b>1 an et 8 jours</b>. Opposition seulement en cas de perte, de vol ou d’utilisation frauduleuse."},
{q:"Prélèvement rejeté, prélèvement contesté ?",a:"Rejet si le compte est insuffisant, avec des frais plafonnés par la loi. Un prélèvement autorisé peut être contesté pendant <b>8 semaines</b>."},
{q:"Compte joint, procuration, décès : que se passe-t-il ?",a:"<b>Compte joint</b> : chacun agit seul, tous sont responsables des dettes ; il continue au décès d’un titulaire (sauf opposition d’un héritier).<br><b>Procuration</b> : annulable à tout moment, prend fin au décès.<br><b>Décès</b> : compte individuel bloqué ; frais d’obsèques payables dans une certaine limite."},
{q:"La fraude au faux conseiller, c’est quoi ?",a:"Un escroc se fait passer pour la banque (le numéro affiché peut même être celui de l’agence). Règle d’or : <b>une banque ne demande jamais un code</b>. Le client raccroche et rappelle son conseiller.<br>Depuis octobre 2025, la banque vérifie que le nom du bénéficiaire correspond à l’IBAN."}],

<script>
(function(){
const app=document.getElementById("app");
const START="2026-11-06";
let GOAL="2026-12-07";
const HOLIDAYS=["2026-11-11","2026-12-25","2027-01-01","2027-04-05","2027-05-01","2027-05-08"];
const BOX_DAYS=[1,2,4,7,14,30];
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const isWeekday=s=>{const g=pd(s).getDay();return g>0&&g<6};
const fmt=s=>{const d=pd(s);return JOURS[d.getDay()]+" "+d.getDate()+"/"+pad(d.getMonth()+1)};

    const cand=d.quiz.filter(q=>q.k==="qcm"&&!q.lab&&/_{2,}/.test(q.q)&&q.o&&q.o.length>=2&&W(q.o[q.a])===1&&q.o.some((o,i)=>i!==q.a&&W(o)===1&&o.toLowerCase()!==q.o[q.a].toLowerCase()));

(function(){
  const KEY=[/12\s?000/,/10\s?000/,/1\s?600/,/61\s?200/,/15\s?300/,/150\s?000/,/7 à 8\s?%/,/2 à 3\s?%/,/14\s?jours/,/1 an et 8 jours/,/8 semaines/,/(^|[^\d,])30\s?%/,/1 voix/,/\d\s?h\b/,/2 min/,/5 ans/,/1 000 € sur un PER/,/1,70\s?%/,/22\s?950/,/2,50\s?%/,/35\s?%/,/25 ans/,/100\s?000/,/8 ans/,/70 ans/,/3 à 6 mois/,/(^|[^\d,])0\s?%/];
  const KEYN=[12000,10000,1600,61200,15300,150000,14,1.7,22950,2.5,35,25,100000,8,70,0];
  const sp=s=>String(s==null?"":s).replace(/<[^>]+>/g," ").replace(/[  ]/g," ");
  const hasNum=s=>/\d/.test(sp(s).replace(/\b(1er|2026|2025|CAC 40)\b/g,""));
  const key=s=>KEY.some(r=>r.test(sp(s)));
  const detail=(ans,all)=>hasNum(ans)&&!key(all);
  function ansOf(q){switch(q.k){
    case "qcm":return q.o&&q.o[q.a];case "num":return String(q.a);case "vf":return q.q;
    case "match":return (q.pairs||[]).map(p=>p.join(" ")).join(" ");case "multi":return (q.ok||[]).map(i=>q.o[i]).join(" ");
    case "err":return q.good;case "sort":return (q.items||[]).map(x=>x[0]).join(" ");case "dlg":return (q.bl||[]).map(b=>b[0]).join(" ");default:return ""}}
  let n=0;
  DAYS.forEach(d=>{if(!d.quiz)return;d.quiz=d.quiz.filter(q=>{
    let drop=false;
    if(q.k==="num")drop=!KEYN.includes(+q.a)&&!/35\s?%/.test(sp(q.q+" "+q.e));
    else{const a=ansOf(q);drop=detail(a,a+" "+(q.q||"")+" "+(q.e||""))}
    if(drop){delete QIDX[q.id];n++}return !drop})});
  Object.keys(CARDS).forEach(id=>{const c=CARDS[id];if(!c.phrase&&detail(c.a,c.a)){delete CARDS[id];n++}});
  window.__nodetail=n;window.__D=DAYS;window.__C=CARDS;
})();

  <textarea id="guess" rows="3" placeholder="Ce que je sais… (ou « je ne sais pas »)" aria-label="Ta réponse"></textarea>
  <div class="row"><button class="btn" id="rev">Vérifier</button></div><div id="out"></div>`,st.again?["Je reviens sur une notion","scene"]:[SES.steps.some(s=>s.t==="cours")?"Vérifie que tu as compris":"Devine d’abord","guess"]);
  const g=document.getElementById("guess"),b=document.getElementById("rev");g.focus();
  b.onclick=()=>{const txt=g.value.trim();b.parentNode.remove();document.querySelector(".hint").remove();g.readOnly=true;
    const blank=!txt||/^je (ne )?sais pas/i.test(txt);
    const an=blank?{ok:[],ko:keyTerms(st.c),note:0}:analyse(txt,st.c);
    const local=blank?`<div class="analysis"><strong>Pas de souci</strong><p>Lis bien la réponse ci-dessus : cette notion reviendra plus tard.</p></div>`:
      `<div class="analysis"><strong>Analyse de ta réponse</strong>${an.ok.length?`<p>✓ Tu avais : ${an.ok.map(x=>`<b>${esc(x)}</b>`).join(", ")}</p>`:""}${an.ko.length?`<p>${SAMPLE?"Mots-clés à retenir":"✗ Il manquait"} : ${an.ko.map(x=>`<b>${esc(x)}</b>`).join(", ")}</p>`:""}<p class="ai" id="ai">${SAMPLE?"✦ Je regarde ta réponse de plus près…":""}</p></div>`;
    document.getElementById("out").outerHTML=`<div class="reveal">${gl(st.c.a)}${sayBtn(st.c.a)}</div>${local}<p class="hint" id="avis">${!blank&&SAMPLE?"✦ J’analyse ta réponse… Tu peux aussi choisir toi-même :":`Mon avis : <b>${["tu ne la savais pas","tu la savais à moitié","tu la savais"][an.note]}</b>. Tu confirmes ?`}</p><div class="rate"><button class="opt" data-r="2">Je savais ✓</button><button class="opt" data-r="1">À moitié</button><button class="opt" data-r="0">Pas su</button></div><div class="row">${explainBtn()}</div>`;
    if(blank||!SAMPLE)app.querySelector(`.rate .opt[data-r="${an.note}"]`).classList.add("sel");
    bindExplain(()=>"Notion : "+st.c.q+"\nRéponse de la fiche : "+strip(st.c.a)+(txt?"\nCe qu’elle avait écrit : "+txt:""));
    if(!blank&&SAMPLE){aiAnalyse("Tu es la professeure d’anglais de Malory, francophone, qui apprend l’anglais pour voyager et communiquer. Compare ce qu’elle a écrit à la réponse de référence. Réponds uniquement en JSON : {\"note\":0|1|2,\"retour\":\"2 phrases maximum en français, en tutoyant : ce qui est juste, ce qui manque ou est faux, sans rien inventer au-delà de la référence\"}. 2 = l’essentiel y est, 1 = en partie, 0 = faux ou absent. Une petite faute d’orthographe ou une autre tournure anglaise correcte comptent comme justes.\n\nQuestion : "+st.c.q+"\nRéférence : "+strip(st.c.a)+"\nSa réponse : "+txt)
      .then(r=>{const el=document.getElementById("ai"),av=document.getElementById("avis");if(!el)return;
        const n=r&&[0,1,2].includes(r.note)?r.note:an.note;
        if(r&&typeof r.retour==="string")el.textContent="✦ "+r.retour;else el.remove();
        app.querySelectorAll(".rate .opt").forEach(x=>x.classList.toggle("sel",+x.dataset.r===n));
        if(av)av.innerHTML=`Mon avis : <b>${["tu ne la savais pas","tu la savais à moitié","tu la savais"][n]}</b>. Tu confirmes ?`})}
    app.querySelectorAll(".rate .opt").forEach(x=>x.onclick=()=>{const r=+x.dataset.r;
      if(r===2)delete S.caps[st.c.id];else S.caps[st.c.id]=r;
      if(r===0&&(SES.kind==="lesson"||SES.kind==="weak")&&!st.redo)SES.steps.splice(tailIdx(),0,{t:"cap",c:st.c,again:true,redo:true});
      save();next()})};
}

/* --- Questions --- */

/* ---------- maîtrise : découvert, travaillé, réussi, maîtrisé ---------- */
function qState(id){const s=S.qs[id];if(!s||!s.n)return 0;const od=s.od||[];
  if(s.lk===1&&od.length>=2&&!S.miss[id])return 4;if(s.lk===1||(s.lk===undefined&&s.ok>0&&!S.miss[id]))return 3;return s.n>=2?2:1}
const QSTATE=["Pas encore vu","Découvert","Travaillé","Réussi","Maîtrisé"];
function dayMastery(d){const ids=d.quiz.map(q=>q.id);const c=[0,0,0,0,0];ids.forEach(id=>c[qState(id)]++);return {c,n:ids.length,pct:ids.length?Math.round(c[4]/ids.length*100):0}}
function ptsFor(st,ok){if(!ok)return 0;const q=st.q||{};if(st.second)return 4;
  let p=(st.typed||["order","sort","err","match","multi","dlg"].includes(q.k))?12:8;if(st.rappel||st.missed)p+=5;return p}
function record(st,ok,pts){SES.total++;if(ok){SES.run=(SES.run||0)+1;SES.miss=0}else{SES.miss=(SES.miss||0)+1;SES.run=0}if(ok){SES.ok++;SES.xp+=(pts===undefined||pts===10)?ptsFor(st,ok):pts}
  if(st.q&&st.q.id){const s=S.qs[st.q.id]||(S.qs[st.q.id]={n:0,ok:0,t:0,idk:0});s.n++;if(ok)s.ok++;if(st.idk)s.idk++;s.lk=ok?1:0;if(ok){const d=today();s.od=(s.od||[]).filter(x=>x!==d).concat([d]).slice(-4)}}
  if(st.q){track(st.q,ok);save();
    if(!ok&&(st.tries||0)<3&&(SES.kind==="lesson"||SES.kind==="weak")&&!(SES.day&&SES.day.exam)){const base=st.base||st.q,nt=(st.tries||0)+1;
      SES.steps.splice(SES.i+1,0,{t:"memo",q:base});
      SES.steps.splice(tailIdx(),0,{t:"q",q:nt===2?base:variant(base),base,from:st.from||base.day,second:true,tries:nt})}}
  if(st.from||SES.kind==="lesson"){const part=(st.from||SES.day).part;const b=SES.byPart[part]||(SES.byPart[part]={ok:0,n:0});b.n++;if(ok)b.ok++}}
function feedback(ok,txt,e){return `<div class="feedback ${ok?"ok":"ko"}"><strong>${ok?"Bonne réponse":"Pas tout à fait"}</strong>${txt?`<p>${txt}</p>`:""}${e?`<p>${esc(e)}</p>`:""}</div>`}
function finish(st,ok,txt,e,idk){const q=st.q;
  const fb=idk?`<div class="feedback idk"><strong>Pas de souci, on l’apprend ensemble</strong><p>${txt}</p>${e?`<p>${esc(e)}</p>`:""}<p>${(st.tries||0)>=3?"Elle reste dans tes points faibles pour les prochains jours.":"Juste après : un mémo pour la retenir. Puis elle revient en fin de leçon sous une autre forme."}</p></div>`:feedback(ok,txt,e);
  const nk=app.querySelector("#idk");if(nk)nk.remove();
  document.getElementById("fb").outerHTML=fb+(ok?"":`<div class="row">${explainBtn()}</div>`)+nextBtn();bindNext();
  if(!ok)bindExplain(()=>"Question : "+q.q+"\nBonne réponse : "+answerText(q)+(q.e?"\nPrécision : "+q.e:"")+"\n\n"+ctxDay(q.day))}
function idkBtn(){return `<div class="row"><button class="btn ghost small" id="idk">Je ne sais pas</button></div>`}
function bindIdk(st,lock){const b=document.getElementById("idk");if(!b)return;b.onclick=()=>{lock();st.idk=true;record(st,false);finish(st,false,"Réponse : "+esc(answerText(st.q)),st.q.e,true)}}

function renderSort(st,promptHtml,tag){const q=st.q;const pick={};
  shell(promptHtml+`<div class="sort5">${q.items.map((x,i)=>`<div class="srow" data-i="${i}"><span class="sw">${esc(x[0])}</span><span class="sbtns">${q.cols.map((c,j)=>`<button class="sb" data-j="${j}">${esc(c)}</button>`).join("")}</span></div>`).join("")}</div>
  <div class="row"><button class="btn" id="schk" disabled>Vérifier</button></div>`+idkBtn()+`<div id="fb"></div>`,tag);
  const rows=[...app.querySelectorAll(".srow")],chk=document.getElementById("schk");
  rows.forEach(r=>r.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{pick[r.dataset.i]=+b.dataset.j;r.querySelectorAll(".sb").forEach(x=>x.classList.toggle("on",x===b));chk.disabled=Object.keys(pick).length<q.items.length}));
  const lock=()=>{chk.parentNode.remove();rows.forEach(r=>{const x=q.items[+r.dataset.i];r.querySelectorAll(".sb").forEach(b=>{b.disabled=true;if(+b.dataset.j===x[1])b.classList.add("ok");else if(b.classList.contains("on"))b.classList.add("ko")});
    const s=document.createElement("small");s.className="sfr";s.textContent=x[2];r.appendChild(s)})};
  chk.onclick=()=>{const bad=q.items.filter((x,i)=>pick[i]!==x[1]).length;lock();const ok=bad<=(q.items.length>=6?1:0);record(st,ok);
    finish(st,ok,bad?(bad===1?"Une seule erreur":bad+" erreurs")+" : regarde les cases vertes.":"Tout est bien rangé !",q.e)};
  bindIdk(st,lock)}
function renderErr(st,promptHtml,tag){const q=st.q;
  shell(promptHtml+`<div class="errw">${q.w.map((w,i)=>`<button class="ew" data-i="${i}">${esc(w)}</button>`).join("")}</div>`+(q.fr?`<p class="frtr"><b>En français</b>« ${esc(q.fr)} »</p>`:"")+idkBtn()+`<div id="fb"></div>`,tag);
  const bs=[...app.querySelectorAll(".ew")];
  const lock=()=>bs.forEach(b=>{b.disabled=true;if(+b.dataset.i===q.at)b.classList.add("ko2")});
  bs.forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.at;lock();if(!ok)b.classList.add("ko");record(st,ok);
    finish(st,ok,(ok?"Bien vu ! ":"Le mot faux était « "+esc(q.w[q.at])+" ». ")+"La bonne phrase : <b>"+esc(q.good)+"</b>",q.e)});
  bindIdk(st,lock)}

function renderMulti(st,promptHtml,tag){const q=st.q;const on=new Set();const order=shuffle(q.o.map((_,i)=>i));
  shell(promptHtml+`<div class="opts multi">${order.map(i=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(q.o[i])}${q.ofr&&q.ofr[i]?`<small class="mfr">${esc(q.ofr[i])}</small>`:""}</button>`).join("")}</div><div class="row"><button class="btn" id="mchk" disabled>Vérifier</button></div>`+idkBtn()+`<div id="fb"></div>`,tag);
  const bs=[...app.querySelectorAll(".multi .opt")],chk=document.getElementById("mchk");
  bs.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(on.has(i))on.delete(i);else on.add(i);b.classList.toggle("on",on.has(i));b.setAttribute("aria-pressed",on.has(i));chk.disabled=!on.size});
  const lock=()=>{if(chk.parentNode)chk.parentNode.remove();bs.forEach(b=>{b.disabled=true;const i=+b.dataset.i;b.classList.remove("on");if(q.ok.includes(i))b.classList.add("ok");else if(on.has(i))b.classList.add("ko")})};
  chk.onclick=()=>{const ok=q.ok.length===on.size&&q.ok.every(i=>on.has(i));lock();record(st,ok);
    finish(st,ok,ok?"Tu les as toutes trouvées.":"Les bonnes réponses sont en vert.",q.e)};
  bindIdk(st,lock)}
function dlgFill(q,arr){let n=0;return q.lines.map(l=>l[0]+" : "+String(l[1]).replace(/_{2,}/g,()=>arr[n++])).join(" / ")}
function renderDlg(st,promptHtml,tag){const q=st.q;const pick={};let n=0;
  const lines=q.lines.map(l=>{const parts=String(l[1]).split(/_{2,}/);return `<div class="dl"><b>${esc(l[0])}</b><span>${parts.map((p,j)=>(j?`<span class="blk" data-b="${n++}">(${n})</span>`:"")+esc(p)).join("")}</span></div>`}).join("");
  const ch=q.bl.map((opts,k)=>`<div class="dch" data-b="${k}"><span class="dn">${k+1}</span>${shuffle(opts.map((o,j)=>j)).map(j=>`<button class="sb" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div>`).join("");
  shell(promptHtml+`<div class="dlg">${lines}</div><div class="dchs">${ch}</div><div class="row"><button class="btn" id="dchk" disabled>Vérifier</button></div>`+idkBtn()+`<div id="fb"></div>`,tag);
  const chk=document.getElementById("dchk"),rows=[...app.querySelectorAll(".dch")];
  rows.forEach(r=>r.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{const k=+r.dataset.b;pick[k]=+b.dataset.j;r.querySelectorAll(".sb").forEach(x=>x.classList.toggle("on",x===b));
    const bk=app.querySelector(`.blk[data-b="${k}"]`);bk.textContent=q.bl[k][pick[k]];bk.classList.add("fill");chk.disabled=Object.keys(pick).length<q.bl.length}));
  const lock=()=>{if(chk.parentNode)chk.parentNode.remove();rows.forEach(r=>{const k=+r.dataset.b;r.querySelectorAll(".sb").forEach(b=>{b.disabled=true;if(+b.dataset.j===0)b.classList.add("ok");else if(b.classList.contains("on"))b.classList.add("ko")});
    const bk=app.querySelector(`.blk[data-b="${k}"]`);bk.textContent=q.bl[k][0];bk.classList.add(pick[k]===0?"ok":"ko")})};
  chk.onclick=()=>{const bad=q.bl.filter((_,k)=>pick[k]!==0).length;lock();const ok=!bad;record(st,ok);
    finish(st,ok,ok?"Dialogue complet !":(bad===1?"Un blanc à revoir":bad+" blancs à revoir")+" : la bonne réponse est en vert.",q.e)};
  bindIdk(st,lock)}

const LVL_A2={en:"d15",es:"d22"},LVL_B1={en:"d31",es:"d36"};
function lvlOf(d){return null;if(!d||d.story||d.exam)return null;const L=(typeof EN_APP!=="undefined"&&EN_APP)||/anglais/.test(LS)?"en":"es";
  const i=DAYS.indexOf(d),a=DAYS.findIndex(x=>x.id===LVL_A2[L]),b=DAYS.findIndex(x=>x.id===LVL_B1[L]);
  if(i<0)return null;return b>=0&&i>=b?["B1","Intermédiaire"]:a>=0&&i>=a?["A2","Élémentaire"]:["A1","Débutant"]}
function renderQ(st){const q=st.q;
  const tag=st.second?[(st.q.variant?"Même notion, autre jeu ":"Encore une fois "),"scene"]:st.missed?["Point faible · "+st.from.title,"guess"]:st.rappel?["Rappel · "+st.from.title]:st.exam?["Révision · "+st.from.part]:q.lab?[q.lab,"scene"]:q.s?["Mise en situation","scene"]:q.k==="order"?["Remets dans l’ordre"]:q.k==="match"?["Relie les paires"]:q.k==="num"?["Le bon chiffre"]:q.k==="vf"?["Vrai ou faux"]:["Question"];
  const promptHtml=(q.s?`<div class="bubble">${gl(esc(q.q))}</div>`:`<p class="prompt">${gl(esc(q.q))}</p>`)+sayBtn(esc(q.q),null,"<i class=ic-vol></i> Écouter la question")+(q.fr?`<p class="frtr"><b>En français</b>« ${esc(q.fr)} »</p>`:"");
  if(q.k==="multi")return renderMulti(st,promptHtml,tag);if(q.k==="dlg")return renderDlg(st,promptHtml.replace(/<p class="frtr">.*$/s,""),tag);if(q.k==="sort")return renderSort(st,promptHtml.replace(/<p class="frtr">.*$/s,""),tag);if(q.k==="err")return renderErr(st,promptHtml.replace(/<p class="frtr">.*$/s,""),tag);
  if(q.k==="qcm"&&(q.wr||(!q.nt&&typeable(q.o[q.a])&&short4(q.o[q.a])&&askTyped(q.q,q.fr)))&&!((SES.miss||0)>=2&&q.o.length>=2))return renderQTyped(st,promptHtml,tag);
  if(q.k==="qcm"){
    const order=shuffle(q.o.map((_,i)=>i));
    shell(promptHtml+`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${gl(esc(q.o[i]))}</button>`).join("")}</div>`+idkBtn()+`<div id="fb"></div>`,tag);
    const bs=[...app.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===q.a;bs.forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("ok")});if(!ok)b.classList.add("ko");
      record(st,ok);finish(st,ok,ok?"":"Réponse : "+esc(q.o[q.a]),q.e)});
    bindIdk(st,()=>bs.forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("ok")}));
  }else if(q.k==="vf"){
    shell(promptHtml+`<div class="vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>`+idkBtn()+`<div id="fb"></div>`,tag);
    const bs=[...app.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{const v=b.dataset.v==="1",ok=v===q.a;bs.forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.a)x.classList.add("ok")});if(!ok)b.classList.add("ko");
      record(st,ok);finish(st,ok,ok?"":"C’était "+(q.a?"vrai":"faux")+".",q.e)});
    bindIdk(st,()=>bs.forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.a)x.classList.add("ok")}));
  }else if(q.k==="num"){
    shell(promptHtml+`<form class="numrow" id="nf"><input id="num" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><span class="u">${esc(q.u||"")}</span><button class="btn">Valider</button></form>`+idkBtn()+`<div id="fb"></div>`,tag);
    const inp=document.getElementById("num");inp.focus();
    document.getElementById("nf").onsubmit=e=>{e.preventDefault();const v=parseNum(inp.value);if(isNaN(v))return;
      const ok=Math.abs(v-q.a)<=(q.tol||0)+1e-9;inp.disabled=true;e.target.querySelector("button").remove();inp.style.borderColor=ok?"var(--good)":"var(--bad)";
      record(st,ok);finish(st,ok,ok?"":"Réponse : "+frNum(q.a)+" "+esc(q.u||""),q.e)};
    bindIdk(st,()=>{inp.disabled=true;const f=document.getElementById("nf");f.onsubmit=e=>e.preventDefault();const bt=f.querySelector("button");if(bt)bt.remove()});
  }else if(q.k==="order"){
    const items=q.items.map((t,i)=>({t,i}));let sh=shuffle(items);let tries=0;while(sh.every((x,k)=>x.i===k)&&tries++<5)sh=shuffle(items);
    const seq=[];
    shell(promptHtml+`<p class="hint">Touche les morceaux dans le bon ordre. Touche un morceau choisi pour l’enlever.</p><div class="seq" id="seq"></div><div class="opts" id="pool"></div>`+idkBtn()+`<div id="fb"></div>`,tag);
    const draw=()=>{document.getElementById("seq").innerHTML=seq.map((x,k)=>`<button class="opt sel" data-k="${k}"><i>${k+1}.</i><span>${gl(esc(x.t))}</span></button>`).join("");
      document.getElementById("pool").innerHTML=sh.filter(x=>!seq.includes(x)).map(x=>`<button class="opt" data-i="${x.i}">${gl(esc(x.t))}</button>`).join("");
      app.querySelectorAll("#seq .opt").forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.k,1);draw()});
      app.querySelectorAll("#pool .opt").forEach(b=>b.onclick=()=>{seq.push(items[+b.dataset.i]);draw();if(seq.length===items.length)check()})};
    const check=()=>{const ok=seq.every((x,k)=>x.i===k);
      app.querySelectorAll("#seq .opt").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");b.classList.add(seq[k].i===k?"ok":"ko")});
      record(st,ok);finish(st,ok,ok?"":"Le bon ordre : "+q.items.map((t,k)=>(k+1)+". "+esc(t)).join(" → "),q.e)};
    draw();
    bindIdk(st,()=>app.querySelectorAll("#seq .opt,#pool .opt").forEach(b=>b.disabled=true));
  }else if(q.k==="match"){
    const L=q.pairs.map((p,i)=>({t:p[0],i})),R=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
    let sel=null,errors=0,done=0;
    shell(promptHtml+`<p class="hint">Touche un élément à gauche, puis sa réponse à droite.</p><div class="match"><div class="col">${L.map(x=>`<button class="opt" data-l="${x.i}">${esc(x.t)}</button>`).join("")}</div><div class="col">${R.map(x=>`<button class="opt" data-r="${x.i}">${esc(x.t)}</button>`).join("")}</div></div>`+idkBtn()+`<div id="fb"></div>`,tag);
    const lb=[...app.querySelectorAll("[data-l]")],rb=[...app.querySelectorAll("[data-r]")];
    lb.forEach(b=>b.onclick=()=>{lb.forEach(x=>x.classList.remove("sel"));sel=+b.dataset.l;b.classList.add("sel")});
    rb.forEach(b=>b.onclick=()=>{if(sel===null){b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),300);return}
      const l=lb.find(x=>+x.dataset.l===sel);
      if(+b.dataset.r===sel){[l,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});sel=null;done++;
        if(done===L.length){const ok=errors<=1;record(st,ok);finish(st,ok,ok?(errors?"Une seule erreur, c’est validé.":"Sans faute !"):errors+" erreurs : on la refait à la fin de la leçon.")}}
      else{errors++;b.classList.add("ko","flash");setTimeout(()=>b.classList.remove("ko","flash"),450)}});
    bindIdk(st,()=>{done=-99;lb.concat(rb).forEach(x=>x.disabled=true)});
  }
}

/* --- Bilan : ce que j'ai retenu --- */
function renderBilan(st){const d=SES.day;
  const words=s=>String(s).trim().split(/\s+/).length;
  const pool=(d.cards||[]).map((c,i)=>({c,i})).filter(x=>x.c&&x.c[0]&&x.c[1]&&words(x.c[1])<=4&&words(x.c[0])<=6&&!/[?!]$/.test(x.c[1].trim())&&!(S.skips&&S.skips[d.id+"-"+x.i]&&S.skips[d.id+"-"+x.i].forever));
  if(pool.length<2){next();return}
  const pick=shuffle(pool).slice(0,4);

const NUMRE=/(\d+(?:[   ]\d{3})*(?:,\d+)?)(\s?)(%|€|ans|h\b|jours|semaines|mois)/g;
function numPool(){if(numPool.c)return numPool.c;const P={};Object.values(CARDS).forEach(c=>String(c.a).replace(NUMRE,(m,n,s,u)=>{(P[u]=P[u]||new Set()).add(n)}));numPool.c=P;return P}
function mutateNums(a){const ms=[...String(a).matchAll(NUMRE)];if(!ms.length)return [];const P=numPool();const out=new Set();
  const val=x=>parseFloat(x.replace(/[   ]/g,"").replace(",","."));
  for(let tries=0;tries<12&&out.size<3;tries++){const m=ms[Math.floor(Math.random()*ms.length)];const pool=[...(P[m[3]]||[])].filter(x=>x!==m[1]);
    let cand=pool.sort((x,y)=>Math.abs(val(x)-val(m[1]))-Math.abs(val(y)-val(m[1]))).slice(0,4);
    if(!cand.length){const v=val(m[1]);cand=[v*2,v/2,v+1].map(x=>String(Math.round(x*100)/100).replace(".",","))}
    const pick=cand[Math.floor(Math.random()*cand.length)];const r=a.slice(0,m.index)+pick+a.slice(m.index+m[1].length);if(r!==a)out.add(r)}
  return [...out]}
function cardTraps(id){const c=CARDS[id];const W=s=>new Set(words(s).filter(x=>x.length>=4));const aw=W(c.a+" "+c.q);
  const others=Object.keys(CARDS).filter(k=>k!==id&&!CARDS[k].phrase).map(k=>CARDS[k].a).filter((a,i,arr)=>a!==c.a&&arr.indexOf(a)===i);
  const score=a=>{const w=W(a);let s=0;w.forEach(x=>{if(aw.has(x))s++});if(/\d/.test(a)===/\d/.test(c.a))s+=.5;return s+Math.random()*.3};
  const sim=others.map(a=>({a,s:score(a)})).sort((x,y)=>y.s-x.s).map(x=>x.a);
  const mut=mutateNums(c.a);if(c.t)return c.t.concat(mut.slice(0,1)).filter((a,i,arr)=>a!==c.a&&arr.indexOf(a)===i).slice(0,3);return mut.slice(0,2).concat(sim).filter((a,i,arr)=>arr.indexOf(a)===i).slice(0,3)}

function phraseBank(p){const parts=p.x.split(/\[\[(.+?)\]\]/);const ans=parts.filter((_,i)=>i%2);

  SES={kind:"chrono",title:"Jeu de paires",steps:[{},{}],i:0};view="lesson";
  shell(`<p class="prompt">Touche deux cartes qui vont ensemble. Retrouve les ${pick.length} paires avec le moins d’essais possible.</p>
    <div class="pairs">${tiles.map((x,k)=>`<button class="pc ${x.l?"tg":"fr"}" data-k="${k}" aria-label="Carte ${k+1}"><span>${esc(x.t)}</span></button>`).join("")}</div>
    <div class="row" style="justify-content:space-between"><span class="mono" id="ptr">Essais : 0</span><span class="mono" id="pfd">Paires : 0/${pick.length}</span></div>`,["Jeu de paires","scene"]);
  document.getElementById("quit").onclick=()=>home();
  const bs=[...app.querySelectorAll(".pc")];
  const end=()=>{const sec=Math.round((Date.now()-t0)/1000);const score=Math.max(10,100-(tries-pick.length)*8);const rec=score>(S.best.paires||0);if(rec)S.best.paires=score;
    const gain=Math.round(score/10);addTime(KIND.chrono,"Chrono",sec);logSession("chrono","Jeu de paires",sec,found,tries);S.xp+=gain;save();
    shell(`<div class="stage end" style="border:0;padding:0;min-height:0"><span class="stamp">${rec?"Nouveau record":"Bravo"}</span><p class="big">${score}</p><p>${pick.length} paires en ${tries} essais · +${gain} points</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="home">Retour</button></div></div>`,["Jeu de paires","scene"]);
    document.querySelector(".bar .fill").style.width="100%";document.getElementById("quit").onclick=()=>home();
    document.getElementById("again").onclick=startPaires;document.getElementById("home").onclick=home};
  bs.forEach(b=>b.onclick=()=>{if(busy||b.classList.contains("up")||b.classList.contains("done"))return;b.classList.add("up");open.push(b);
    if(open.length<2)return;tries++;document.getElementById("ptr").textContent="Essais : "+tries;
    const [a,c]=open.map(x=>tiles[+x.dataset.k]);
    if(a.i===c.i&&a.l!==c.l){open.forEach(x=>{x.classList.remove("up");x.classList.add("done");x.disabled=true});open=[];found++;
      document.getElementById("pfd").textContent="Paires : "+found+"/"+pick.length;if(found===pick.length)setTimeout(end,600)}
    else{busy=true;open.forEach(x=>x.classList.add("miss"));setTimeout(()=>{open.forEach(x=>x.classList.remove("up","miss"));open=[];busy=false},1100)}})}
function startChrono(){
  const t=today();let days=DAYS.filter(d=>!d.exam&&(S.lessons[d.id]||d.date<=t));if(!days.length)days=DAYS.slice(0,1);
  const pool=[];days.forEach(d=>d.quiz.forEach(q=>{if(q.k==="qcm"||q.k==="vf"||q.k==="num")pool.push({q,from:d})}));
  let list=shuffle(pool);let i=0,score=0,left=60,end=false;
  SES={kind:"chrono",steps:[{},{}],i:0};view="lesson";
  const draw=()=>{if(end)return;GLSEEN=new Set();if(i>=list.length){list=list.concat(shuffle(pool))}const {q}=list[i];
    shell(`<div class="row" style="justify-content:space-between"><span class="timer" id="tm">${left} s</span><span class="mono">Score : ${score}</span></div>
      <p class="prompt">${gl(esc(q.q))}</p><div id="ans"></div>`,["Chrono 60 s"]);
    const ans=document.getElementById("ans");
    const done=ok=>{if(end)return;if(ok)score++;ans.innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><strong>${ok?"Oui !":"Non"}</strong>${ok?"":`<p>${q.k==="qcm"?esc(q.o[q.a]):q.k==="vf"?(q.a?"Vrai":"Faux"):frNum(q.a)+" "+esc(q.u||"")}</p>`}</div>`;i++;setTimeout(draw,ok?350:1100)};
    if(q.k==="qcm"){const order=shuffle(q.o.map((_,k)=>k));ans.innerHTML=`<div class="opts">${order.map(k=>`<button class="opt" data-i="${k}">${gl(esc(q.o[k]))}</button>`).join("")}</div>`;
      ans.querySelectorAll(".opt").forEach(b=>b.onclick=()=>done(+b.dataset.i===q.a))}
    else if(q.k==="vf"){ans.innerHTML=`<div class="vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>`;
      ans.querySelectorAll(".opt").forEach(b=>b.onclick=()=>done((b.dataset.v==="1")===q.a))}
    else{ans.innerHTML=`<form class="numrow"><input inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><span class="u">${esc(q.u||"")}</span><button class="btn">OK</button></form>`;
      const f=ans.querySelector("form"),inp=f.querySelector("input");inp.focus();f.onsubmit=e=>{e.preventDefault();const v=parseNum(inp.value);if(isNaN(v))return;done(Math.abs(v-q.a)<=(q.tol||0)+1e-9)}}
    document.getElementById("quit").onclick=()=>{end=true;clearInterval(SES.tick);home()};
  };
  SES.tick=setInterval(()=>{left--;const el=document.getElementById("tm");if(el)el.textContent=left+" s";
    if(left<=0){clearInterval(SES.tick);end=true;addTime(KIND.chrono,"Chrono",60);logSession("chrono","Chrono 60 s",60,score,i);const rec=score>(S.best.chrono||0);if(rec)S.best.chrono=score;S.xp+=score*3;save();
      shell(`<div class="stage end" style="border:0;padding:0;min-height:0"><span class="stamp">${rec?"Nouveau record":"Temps écoulé"}</span><p class="big">${score}</p><p>bonnes réponses en 60 secondes · +${score*3} points</p><div class="row" style="justify-content:center"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="home">Retour</button></div></div>`,["Chrono 60 s"]);
      document.querySelector(".bar .fill").style.width="100%";
      document.getElementById("again").onclick=startChrono;document.getElementById("home").onclick=home}},1000);
  draw();
}

/* confort de navigation */
(function(){
  try{history.pushState({bloup:1},"")}catch(e){}
  addEventListener("popstate",function(){
    try{history.pushState({bloup:1},"")}catch(e){}
    if(document.querySelector(".modal,.ovl"))return;
    if(view==="home"){if(window.__swap)window.__swap();return}
    const q=document.getElementById("quit");if(q){q.click();return}
    home()});
  const root=document.getElementById("app")||document.body;
  new MutationObserver(function(ms){for(const m of ms)for(const n of m.addedNodes){
    if(n.nodeType!==1)continue;const f=n.classList&&n.classList.contains("feedback")?n:n.querySelector&&n.querySelector(".feedback");
    if(f){setTimeout(function(){const H=document.documentElement.scrollHeight;if(H>innerHeight+4)window.scrollTo({top:H,behavior:"smooth"})},80);return}}})
    .observe(root,{childList:true,subtree:true});
})();
home();
})();
